 invite_foreign_volunteers_cat_desc: "В условиях ограниченных людских ресурсов внутри страны мы можем обратиться к поддерживающим нас за рубежом. Добровольцы из дружественных стран могут быть готовы пересечь границы и взять в руки оружие ради нашего дела."
